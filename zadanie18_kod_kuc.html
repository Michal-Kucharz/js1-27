      <!DOCTYPE html>

</head>   
<body> 
<div style="color:navy;font-size:50px;"> 
<script type="text/javascript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_kuc(a, b) {return a + b;}
function odejmowanie_kuc(a, b) {return a - b;} 
function mnozenie_kuc(a, b) {return a * b;} 
function od_kwadratu_kuc(a) {return a*a;} 
function reszta_z_dzielenia_kuc(a, b) {return a % b;}  
document.write("suma="+suma_kuc(a,b)+"<br>");
document.write("odejmowanie="+odejmowanie_kuc(a,b)+"<br>");
document.write("mnozenie="+mnozenie_kuc(a,b)+"<br>");
document.write("kwadrat=<br>"+a+"^2="+od_kwadratu_kuc(a)+"<br>"+b+"^2="+od_kwadratu_kuc(b)+"<br>");
document.write("reszta z dzielenia="+reszta_z_dzielenia_kuc(a,b)+"<br>");
</script> 
</div>
