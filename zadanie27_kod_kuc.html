<!DOCTYPE html>

<script type="text/javascript"> 
function wysokosc_kucharz(odl_kuc,dro_kuc){
o=parseFloat(odl_kuc);
d=parseFloat(dro_kuc);
h_wynik=Math.pow(d*d-o*o,1/2);
document.getElementsByName('wys')[0].value=h_wynik.toFixed(2);}
function kat_kucharz(odl_kuc,dro_kuc){
o=parseFloat(odl_kuc);
d=parseFloat(dro_kuc);
rad=Math.acos(o/d);
kat_wynik=rad*180/Math.PI; 
document.getElementsByName('kat')[0].value=kat_wynik.toFixed(2);}
</script>
</head>
