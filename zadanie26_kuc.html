<!DOCTYPE html>
<html lang="pl-PL">
 <head> 
  <meta charset="UTF-8">
 <title>zadanie 26</title> 
<script type="text/javascript"> 
function pow_kucharz(a_kuc,b_kuc,h_kuc){
a=parseFloat(a_kuc);
b=parseFloat(b_kuc);
h=parseFloat(h_kuc);
pow_wynik=(a+b)*h/2;
document.getElementsByName('pow')[0].value=pow_wynik.toFixed(2);       
}
function obw_kucharz(a_kuc,b_kuc,h_kuc){
a=parseFloat(a_kuc);
b=parseFloat(b_kuc);
h=parseFloat(h_kuc);
r=Math.pow(Math.pow(h,2)+Math.pow(Math.abs(b-a),2),1/2);
obw_wynik=a+b+r+r; 
document.getElementsByName('obw')[0].value=obw_wynik.toFixed(2);         
}
</script>
</head>  
<body>

obw_kucharz(this.a_dana_kuc.value,this.b_dana_kuc.value,this.h_dana_kuc.value);return false">
