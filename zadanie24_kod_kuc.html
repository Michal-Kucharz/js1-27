<!DOCTYPE html>
<html lang="pl-PL"> 
     <head> 
      <meta charset="UTF-8">
            <title>zadanie 24</title> 
</head>  
<body> 
<div style="color:blue;font-size:33px;"> 
<script type="text/javascript"> 
var x1_kuc=prompt("x1=","");
var x2_kuc=prompt("x2=","");
var x1=parseFloat(x1_kuc); 
var x2=parseFloat(x2_kuc);
var x1_rad = x1*Math.PI/180; 
document.write("Wczytane liczby: &nbsp&nbsp x1 = "+x1+"&nbsp&nbsp&nbsp&nbsp&nbspx2 = "+x2+"<br>x1 [w stopniach] = "+x1+"&nbsp&nbsp&nbsp&nbsp&nbspx1 [w radianach] = "+x1_rad.toFixed(2)+"<br>");
var y1=3*Math.pow(x1,6/8);
document.write("y1 = "+y1.toFixed(2)+"<br>");
var y2=2*Math.cos(x1_rad)+3*Math.sin(x1_rad);
document.write("y2 = "+y2.toFixed(2)+"<br>");
var y3=Math.pow(Math.pow(x1,5)+2*Math.pow(x2,4),1/3)*Math.abs(x1-x2);
document.write("y3 = "+y3.toFixed(2)+"<br>");
</script> 
</div><form> 
<input type="button" value="zamknij okno" onclick="window.close()"></form> 
</body>
