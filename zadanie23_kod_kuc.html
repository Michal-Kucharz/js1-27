<script type="text/javascript"> 
function drabina_kucharz(d_kuc,x_kuc){
d=parseFloat(d_kuc);
x=parseFloat(x_kuc);
drabina_wynik=Math.pow(Math.pow(d,2)+Math.pow(x,2),0.5);
document.getElementsByName('drabina')[0].value=drabina_wynik.toFixed(2);}
function alfa_kucharz(d_kuc,x_kuc){
d=parseFloat(d_kuc);
x=parseFloat(x_kuc);
alfa_wynik=Math.atan(d/x)*180/Math.PI; 
document.getElementsByName('alfa')[0].value=alfa_wynik.toFixed(2);}
</script>
